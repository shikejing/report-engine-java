server.port=8080

# ===== 报表引擎配置 =====
# 数据存储根目录（定义版本、渲染作业、分块结果均落在此目录）
report.engine.data-dir=data

# 渲染线程池
report.engine.render.core-pool-size=4
report.engine.render.max-pool-size=16
report.engine.render.queue-capacity=200

# 每批渲染行数（输出分块大小）
report.engine.render.batch-size=500

# 单个渲染任务默认超时（毫秒）
report.engine.render.default-timeout-ms=300000

# 单次渲染最大行数
report.engine.render.max-rows=1000000
